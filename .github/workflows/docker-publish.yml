# Publishes the dashboard image to Docker Hub (<DOCKERHUB_USERNAME>/inverter-dashboard)
# for amd64 and arm64 NAS models, so it can be found in Synology Container
# Manager's Registry (and pulled with docker anywhere).
#
# - On every published GitHub release: tags <version> (v2.4.0 -> 2.4.0) and latest
#   (latest only for normal releases, not pre-releases).
# - By hand (Actions -> Publish Docker image -> Run workflow): builds the
#   chosen branch or tag and pushes it as the given version (and latest if asked).
#
# Needs the repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN
# (a Docker Hub access token with read & write, not the password).
name: Publish Docker image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Image version tag, e.g. 2.4.0"
        required: true
      latest:
        description: "Also tag it as latest"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: docker-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Tags
        id: tags
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/inverter-dashboard
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_LATEST: ${{ inputs.latest }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            version="${RELEASE_TAG#v}"
            latest=$([ "$PRERELEASE" = "true" ] && echo false || echo true)
          else
            version="${INPUT_VERSION#v}"
            latest="$INPUT_LATEST"
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
            echo "::error::Not a version: '$version'"; exit 1
          fi
          tags="$IMAGE:$version"
          [ "$latest" = "true" ] && tags="$tags,$IMAGE:latest"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing $tags"

      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.title=Inverter Dashboard
            org.opencontainers.image.description=Web dashboard for hybrid solar inverters: battery, grid, outages, air raid alerts
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max
