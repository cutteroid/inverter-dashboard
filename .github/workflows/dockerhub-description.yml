# Copies docs/dockerhub.md to the Docker Hub repository's overview and sets its
# short description, whenever that file changes on main (or by hand:
# Actions -> Docker Hub description -> Run workflow).
#
# Uses the repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN. Editing the
# description needs a token that may change the repository: if this fails with
# "Forbidden", give the token "Read, Write, Delete" access on Docker Hub.
name: Docker Hub description

on:
  push:
    branches: [main]
    paths:
      - docs/dockerhub.md
      - .github/workflows/dockerhub-description.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  description:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/inverter-dashboard
          short-description: Web dashboard for hybrid solar inverters with battery, grid, outages and air alerts
          readme-filepath: ./docs/dockerhub.md
          enable-url-completion: true
