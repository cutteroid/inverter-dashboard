services:
  inverter-dashboard:
    # Built locally; the name lets tools/export_images.sh ship it to another machine
    image: extended-dashboard:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inverter-dashboard
    ports:
      - "8080:8080"
    # Configuration is read from ./data/.env (the app loads it via python-dotenv).
    # Don't pass settings as `environment:` here — env vars take precedence over
    # .env, so values saved from the dashboard's "Edit configuration" would be ignored.
    # With no ./data/.env, the dashboard starts in first-run onboarding mode.

    volumes:
      # Persistent data files, including .env
      - ./data:/app/data

    restart: unless-stopped

    # Network configuration
    networks:
      - inverter-network

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # MQTT broker for the smart electricity meter: point the meter at this machine's
  # IP, port 1883, with SMART_METER_MQTT_USER / SMART_METER_MQTT_PASSWORD from
  # data/.env (without them the broker isn't reachable from the network)
  mosquitto:
    image: eclipse-mosquitto:2.0.20
    container_name: inverter-mosquitto
    entrypoint: ["/bin/sh", "/mosquitto-entrypoint.sh"]
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/entrypoint.sh:/mosquitto-entrypoint.sh:ro
      - ./data/mosquitto:/mosquitto/data
      # read-only: the entrypoint takes the broker login from data/.env
      # (works with older Compose versions, e.g. on Synology, unlike optional env_file)
      - ./data:/dashboard-data:ro
    restart: unless-stopped
    networks:
      - inverter-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  inverter-network:
    driver: bridge

